name: CI - Frontend to ECS

on:
  push:
    branches: [main, temp]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches: [main, temp]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/frontend-ci.yml'

  workflow_run:
    workflows: ["Terraform Infrastructure"]
    types: [completed]

  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to rollback to"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: frontend-execute-techacademy
  ECS_CLUSTER_NAME: ecs-cluster-execute-techacademy
  ECS_FRONTEND_SERVICE: frontend-ecs-service-execute-techacademy
  ECS_FRONTEND_TASK_FAMILY: frontend-task-family-execute-techacademy
  ECS_FRONTEND_CONTAINER_NAME: frontend-container-execute-techacademy

# LINT, BUILD FRONTEND IMAGE AND TRIVY SCAN
jobs:

  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB DNS name
        id: alb
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names alb-execute-techacademy \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "url=http://$DNS" >> "$GITHUB_OUTPUT"

      - name: Build Image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL="${{ steps.alb.outputs.url }}" \
            -t frontend-execute-techacademy:${{ github.sha }} \
            .

      - name: Save Image
        run: |
          docker save frontend-execute-techacademy:${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: image.tar.gz

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load Image
        run: |
          gunzip -c image.tar.gz | docker load

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend-execute-techacademy:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  # PUSH IMAGE TO ECR & DEPLOY TO ECS
  deploy:
    name: Push to ECR and Deploy to ECS
    runs-on: ubuntu-latest
    needs: trivy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/temp'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load Image
        run: |
          gunzip -c image.tar.gz | docker load

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag with commit SHA and push
      - name: Tag and Push Image
        run: |
          docker tag frontend-execute-techacademy:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Download current task definition
      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_FRONTEND_TASK_FAMILY }} \
            --query taskDefinition \
            --output json |
            jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > task-definition.json

      # Render new task definition with updated image
      - id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_FRONTEND_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Register new revision and deploy
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          force-new-deployment: true

      # Verify deployment
      - name: Verify Deployment
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_FRONTEND_SERVICE }} \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition' \
            --output text

  # MANUAL ROLLBACK FOR FRONTEND (ECS)
  rollback:
    name: Rollback Frontend ECS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_FRONTEND_TASK_FAMILY }} \
            --query taskDefinition \
            --output json |
            jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > task-definition.json

      - id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_FRONTEND_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.commit_sha }}

      - name: Deploy Rollback
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          force-new-deployment: true